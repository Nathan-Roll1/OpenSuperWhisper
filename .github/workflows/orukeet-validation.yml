name: Orukeet Xcode validation
on:
  push:
    branches: [codex/orukeet-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c79a2708d19290e6b2e9b4cbbc4249e913d3d602
          submodules: recursive
      - name: Record exact source and toolchain
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt
          xcodebuild -version | tee evidence/xcode-version.txt
          swift --version | tee evidence/swift-version.txt
      - name: Configure opt-in real-engine validation
        shell: bash
        run: |
          mkdir -p fixtures
          for name in en de fr silence; do
            curl --fail --retry 3 --location "https://raw.githubusercontent.com/Nathan-Roll1/muesli/5f03f1e/.validation-fixtures/$name.wav" -o "fixtures/$name.wav"
          done
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('OpenSuperWhisper.xcodeproj/xcshareddata/xcschemes/OpenSuperWhisper.xcscheme')
          tree = ET.parse(p)
          action = tree.getroot().find('TestAction')
          action.set('shouldUseLaunchSchemeArgsEnv', 'NO')
          variables = ET.SubElement(action, 'EnvironmentVariables')
          ET.SubElement(variables, 'EnvironmentVariable', key='ORUKEET_AUDIO_DIR', value=str(Path('fixtures').resolve()), isEnabled='YES')
          tree.write(p)
          PYTHON
      - name: Prepare native dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake libomp
          cmake -G Xcode -B libwhisper/build -S libwhisper
          mkdir -p build
          CARGO_PROFILE_RELEASE_LTO=true CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 CARGO_PROFILE_RELEASE_STRIP=symbols CARGO_PROFILE_RELEASE_PANIC=abort cargo build -p autocorrect-swift --release --target aarch64-apple-darwin --manifest-path=libautocorrect/Cargo.toml
          cp libautocorrect/target/aarch64-apple-darwin/release/libautocorrect_swift.dylib build/
          install_name_tool -id '@rpath/libautocorrect_swift.dylib' build/libautocorrect_swift.dylib
          codesign --force --sign - build/libautocorrect_swift.dylib
          cp /opt/homebrew/opt/libomp/lib/libomp.dylib build/
          install_name_tool -id '@rpath/libomp.dylib' build/libomp.dylib
          codesign --force --sign - build/libomp.dylib
      - name: Build complete app and focused tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -scheme OpenSuperWhisper -configuration Debug -jobs 4 -derivedDataPath build -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation -skipMacroValidation -clonedSourcePackagesDirPath SourcePackages CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO build | tee evidence/xcode-build.log
          xcodebuild -scheme OpenSuperWhisper -configuration Debug -jobs 4 -derivedDataPath build -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation -skipMacroValidation -clonedSourcePackagesDirPath SourcePackages CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO -only-testing:OpenSuperWhisperTests/OrukeetModelStoreTests -only-testing:OpenSuperWhisperTests/LanguageSupportTests -only-testing:OpenSuperWhisperTests/DownloadCancellationTests -only-testing:OpenSuperWhisperTests/EngineLoadingTests test | tee evidence/xcode-tests.log
      - name: Archive actual app preserving symlinks
        if: success()
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug/OpenSuperWhisper.app evidence/OpenSuperWhisper.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenSuperWhisper-orukeet-validation
          path: evidence/
          retention-days: 14
